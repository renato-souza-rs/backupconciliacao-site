# Atualiza os dados do Monitor de mercado (dados/radar.json e dados/mercado.json).
# Roda de 3 em 3 horas, das 6h às 21h de Brasília (o cron é em UTC), e sob demanda.
# Só grava quando há dado novo; falha de rede mantém o que já está publicado.
name: Monitor de mercado

on:
  schedule:
    - cron: "0 9,12,15,18,21,0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-mercado
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerar dados
        run: python scripts/monitor_mercado.py

      - name: Publicar dados
        run: |
          git config user.name "monitor-mercado[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/radar.json dados/mercado.json
          if git diff --cached --quiet; then
            echo "Sem mudança nos dados."
            exit 0
          fi
          git commit -m "chore(monitor): atualizar dados do mercado"
          git push
